name: ROSACE — validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [chatgpt/rosace-landing-clarity-20261108]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rosace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ARTIFACT_DIR: tests/artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: create-ultra-realistic-concept (15)/package-lock.json

      - name: Installation
        working-directory: create-ultra-realistic-concept (15)
        run: npm ci --no-audit --no-fund

      - name: Tests unitaires
        working-directory: create-ultra-realistic-concept (15)
        run: npm test

      - name: Typecheck strict
        working-directory: create-ultra-realistic-concept (15)
        run: npm run typecheck

      - name: Build (multifichier, dist/)
        working-directory: create-ultra-realistic-concept (15)
        run: npm run build

      - name: Inventaire des licences
        working-directory: create-ultra-realistic-concept (15)
        run: npm run licenses

      - name: Chromium pour Playwright
        working-directory: create-ultra-realistic-concept (15)
        run: |
          npx playwright install --with-deps chromium
          echo "CHROMIUM_PATH=$(node -e 'console.log(require("playwright").chromium.executablePath())')" >> "$GITHUB_ENV"

      - name: Parcours navigateur + accessibilité bloquante sur le serveur de dev
        working-directory: create-ultra-realistic-concept (15)
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 --strictPort > /tmp/rosace-dev.log 2>&1 &
          echo $! > /tmp/rosace-dev.pid
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:5173 > /dev/null && break; sleep 1; done
          BASE_URL=http://127.0.0.1:5173 npm run test:browser
          BASE_URL=http://127.0.0.1:5173 npm run test:a11y
          kill "$(cat /tmp/rosace-dev.pid)" || true

      - name: Fumage du build servi par npm run preview
        working-directory: create-ultra-realistic-concept (15)
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/rosace-preview.log 2>&1 &
          echo $! > /tmp/rosace-preview.pid
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:4173 > /dev/null && break; sleep 1; done
          BASE_URL=http://127.0.0.1:4173 npm run test:preview
          kill "$(cat /tmp/rosace-preview.pid)" || true

      - name: Artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rosace-artefacts
          path: create-ultra-realistic-concept (15)/tests/artifacts
          if-no-files-found: ignore
